name: Build Windows OpenCV5.0.0 exe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSVC (VS2022)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download OpenCV 5.0.0 official Windows package
        run: |
          Invoke-WebRequest -Uri "https://github.com/opencv/opencv/releases/download/5.0.0/opencv-5.0.0-windows.exe" -OutFile "opencv-5.0.0-windows.exe"

      - name: Extract OpenCV
        run: |
          .\opencv-5.0.0-windows.exe -o .\opencv -y

      - name: Compile (separate modules, same as your Mac)
        run: |
          cl youjizhuyi.cpp /Fe:youjizhuyi.exe `
          -I.\opencv\build\include `
          /link /LIBPATH:.\opencv\build\x64\vc17\lib `
          opencv_core5.lib opencv_highgui5.lib opencv_imgproc5.lib opencv_imgcodecs5.lib

      - name: Copy required dlls
        run: |
          copy .\opencv\build\x64\vc17\bin\opencv_core5.dll .
          copy .\opencv\build\x64\vc17\bin\opencv_highgui5.dll .
          copy .\opencv\build\x64\vc17\bin\opencv_imgproc5.dll .
          copy .\opencv\build\x64\vc17\bin\opencv_imgcodecs5.dll .

      - name: Zip release
        run: |
          Compress-Archive -Path youjizhuyi.exe,input.png,opencv_core5.dll,opencv_highgui5.dll,opencv_imgproc5.dll,opencv_imgcodecs5.dll -DestinationPath release.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release.zip
