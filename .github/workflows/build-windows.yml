name: Build Windows OpenCV5.0.0 exe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSVC (VS2022)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download OpenCV 5.0.0
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/opencv/opencv/releases/download/5.0.0/opencv-5.0.0-windows.exe" -OutFile "opencv-5.0.0-windows.exe"

      - name: Extract OpenCV
        run: |
          .\opencv-5.0.0-windows.exe -o .\opencv -y
          echo "===== 列出lib目录文件 ====="
          dir .\opencv\build\x64\vc17\lib

      - name: Compile
        run: |
          cl youjizhuyi.cpp /Fe:youjizhuyi.exe /EHsc -I.\opencv\build\include /link /LIBPATH:.\opencv\build\x64\vc17\lib opencv_core500.lib opencv_highgui500.lib opencv_imgproc500.lib opencv_imgcodecs500.lib

      - name: Copy DLL
        run: |
          copy .\opencv\build\x64\vc17\bin\opencv_core500.dll .
          copy .\opencv\build\x64\vc17\bin\opencv_highgui500.dll .
          copy .\opencv\build\x64\vc17\bin\opencv_imgproc500.dll .
          copy .\opencv\build\x64\vc17\bin\opencv_imgcodecs500.dll .

      - name: Zip
        run: |
          Compress-Archive -Path youjizhuyi.exe,input.png,opencv_core500.dll,opencv_highgui500.dll,opencv_imgproc500.dll,opencv_imgcodecs500.dll -DestinationPath release.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release.zip
