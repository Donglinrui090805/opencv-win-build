name: Build Windows OpenCV5.0.0 exe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSVC compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install OpenCV 5
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'a42af01b72c89b79ccae191c5272f14c35bba20'
          runVcpkgInstall: opencv:x64-windows

      - name: Compile youjizhuyi.cpp
        run: |
          cl youjizhuyi.cpp /Fe:youjizhuyi.exe /I%VCPKG_ROOT%\installed\x64-windows\include /link /LIBPATH:%VCPKG_ROOT%\installed\x64-windows\lib opencv_world5.lib

      - name: Copy OpenCV dll
        run: |
          copy %VCPKG_ROOT%\installed\x64-windows\bin\opencv_world5.dll .

      - name: Zip all runtime files
        run: |
          Compress-Archive -Path youjizhuyi.exe,input.png,opencv_world5.dll -DestinationPath release.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release.zip
