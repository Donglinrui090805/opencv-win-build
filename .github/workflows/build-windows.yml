name: Build Windows OpenCV exe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装MinGW
        uses: egor-tensin/setup-mingw@v2
        with:
          version: x86_64-13.2.0-release-posix-seh-msvcrt-rt_v11-rev1

      - name: 下载OpenCV
        run: |
          Invoke-WebRequest https://github.com/opencv/opencv/releases/download/5.0.0/opencv-5.0.0-windows.exe -OutFile opencv.exe
          .\opencv.exe -o .\opencv -y

      - name: 编译程序
        run: |
          g++ youjizhuyi.cpp -o youjizhuyi.exe -Iopencv\build\include -Lopencv\build\x64\mingw\lib -lopencv_core4100 -lopencv_imgproc4100 -lopencv_highgui4100 -lopencv_imgcodecs4100

      - name: 打包文件
        run: |
          Copy-Item opencv\build\x64\mingw\bin\*.dll .
          Compress-Archive -Path youjizhuyi.exe,input.png,*.dll -DestinationPath release.zip

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release.zip
